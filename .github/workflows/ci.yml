name: CI
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version && npm --version && npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:vercel
        env:
          VERCEL: '1'   # Vercel sets this during its build; mirror it
      - run: du -sh .vercel/output/functions/api/index.func && cat .vercel/output/config.json
